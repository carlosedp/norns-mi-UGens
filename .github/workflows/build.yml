name: build norns mi-UGens

# Tag pushes (v*) build the defaults below and publish a release. The norns
# installer script (mi-ugens-install.lua) downloads the release asset with the
# fixed name mi-UGens-norns.tar.gz from the latest release; mi-UGens-wasm.tar.gz
# is the WebAssembly build for web pages, and mi-UGens-native-<os>-<arch>.tar.gz
# the native libraries for plugins and apps (one job per platform, below).
#
# Manual runs (Actions > Run workflow) can override everything and only upload
# a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: mi-UGens repository
        default: https://github.com/v7b1/mi-UGens
      ref:
        description: branch, tag or commit
        default: main
      prs:
        description: space-separated PR numbers to merge ("none" for no PRs)
        default: "24"
      sc_version:
        description: SuperCollider tag for headers
        default: Version-3.12.2
  push:
    tags: ['v*']

env:
  # Defaults for tag builds. Drop "24" once MiBeads is merged upstream, or point
  # DEFAULT_REPO at your fork.
  DEFAULT_REPO: https://github.com/v7b1/mi-UGens
  DEFAULT_REF: main
  DEFAULT_PRS: "24"
  DEFAULT_SC_VERSION: Version-3.12.2

jobs:
  # native libraries (native/README.md), built and tested on each platform
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x86_64
            os: ubuntu-22.04   # the oldest runner: what it links against (glibc) is what users need
          - plat: macos-universal
            os: macos-14
          - plat: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings (build.sh runs in Git Bash on Windows)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Build
        env:
          REPO: ${{ inputs.repo || env.DEFAULT_REPO }}
          REF: ${{ inputs.ref || env.DEFAULT_REF }}
          PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.prs || env.DEFAULT_PRS }}
        run: |
          args=(--lib --repo "$REPO" --ref "$REF")
          for pr in $PRS; do [[ $pr == none ]] || args+=(--pr "$pr"); done
          ./build.sh "${args[@]}"
          # named after the tag on a release, plus the fixed name pages and plugins fetch
          kind=native-${{ matrix.plat }}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            mv dist/mi-UGens-$kind-*.tar.gz "dist/mi-UGens-$kind-${GITHUB_REF_NAME}.tar.gz"
          fi
          cp dist/mi-UGens-$kind-*.tar.gz dist/mi-UGens-$kind.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mi-UGens-native-${{ matrix.plat }}
          path: dist/mi-UGens-native-*.tar.gz

  build:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4   # the wasm build renders each UGen in node to test it
        with:
          node-version: 20

      - name: Build
        env:
          REPO: ${{ inputs.repo || env.DEFAULT_REPO }}
          REF: ${{ inputs.ref || env.DEFAULT_REF }}
          PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.prs || env.DEFAULT_PRS }}
          SC_VERSION: ${{ inputs.sc_version || env.DEFAULT_SC_VERSION }}
        run: |
          args=(--engine docker --repo "$REPO" --ref "$REF" --sc-version "$SC_VERSION")
          for pr in $PRS; do [[ $pr == none ]] || args+=(--pr "$pr"); done
          ./build.sh "${args[@]}"            # for norns (armhf)
          ./build.sh "${args[@]}" --wasm     # for browsers (wasm/README.md)
          # a release's assets are named after its tag (v1.0.0), not the upstream
          # mi-UGens version, which BUILDINFO inside records; plus the fixed names that
          # installers and pages fetch from the latest release
          for kind in norns wasm; do
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              mv dist/mi-UGens-$kind-*.tar.gz "dist/mi-UGens-$kind-${GITHUB_REF_NAME}.tar.gz"
            fi
            cp dist/mi-UGens-$kind-*.tar.gz dist/mi-UGens-$kind.tar.gz
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mi-UGens-norns
          path: dist/mi-UGens-norns-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mi-UGens-wasm
          path: dist/mi-UGens-wasm-*.tar.gz

      - uses: actions/download-artifact@v4   # the native jobs' packages, for the release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          pattern: mi-UGens-native-*
          path: dist
          merge-multiple: true

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "Mutable Instruments modules for monome norns and norns shield: Beads, Braids, Clouds,"
            echo "Elements, Grids, Mu, Omi, Plaits, Rings, Ripples, Tides, Verb and Warps."
            echo
            echo "**To install:** run the [mi-ugens-install](https://github.com/${GITHUB_REPOSITORY}#install) script on your norns"
            echo "and press K3, or let a script that needs them install them for you. Then SYSTEM > RESTART."
            echo "Other ways (ssh, local file) are in the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo
            echo "**For web pages:** \`mi-UGens-wasm.tar.gz\` has Plaits, Rings, Elements, Clouds, Beads, Ripples and Verb"
            echo "built as WebAssembly, to play in an AudioWorklet. See [wasm/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/wasm/README.md)."
            echo
            echo "**For plugins and apps:** \`mi-UGens-native-<os>-<arch>.tar.gz\` has the same seven as native libraries for Linux,"
            echo "macOS (universal) and Windows, with a header-only C++ loader. See [native/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/native/README.md)."
            echo
            echo "### Build"
            echo '```'
            cat work/out/mi-UGens/BUILDINFO
            echo '```'
          } > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mi-UGens-norns-*.tar.gz
            dist/mi-UGens-norns.tar.gz
            dist/mi-UGens-wasm-*.tar.gz
            dist/mi-UGens-wasm.tar.gz
            dist/mi-UGens-native-*.tar.gz
          body_path: release-notes.md
